<div class="page-title"><h1>📝 แบบทดสอบก่อนเรียน</h1><p>เลือกคำตอบที่คิดว่าถูกต้อง</p></div>
<div class="card">
<div class="question"><b>1. ข้อใดเป็นข้อมูลส่วนตัวที่ควรเก็บเป็นความลับ?</b>
<label><input type="radio" name="q1" value="a"> สีที่ชอบ</label><label><input type="radio" name="q1" value="b"> รหัสผ่าน</label><label><input type="radio" name="q1" value="c"> วิชาที่ชอบ</label></div>
<div class="question"><b>2. หากพบข้อความจากคนแปลกหน้าขอข้อมูลส่วนตัว ควรทำอย่างไร?</b>
<label><input type="radio" name="q2" value="a"> บอกข้อมูลทันที</label><label><input type="radio" name="q2" value="b"> ส่งรูปให้</label><label><input type="radio" name="q2" value="c"> บอกผู้ใหญ่ที่ไว้ใจ</label></div>
<div style="text-align:center"><button class="btn" onclick="check()">ตรวจคำตอบ</button></div><div id="result" class="result" style="display:none"></div>
</div></div>
<script>
function check(){let s=0;if(document.querySelector('input[name=q1]:checked')?.value==='b')s++;if(document.querySelector('input[name=q2]:checked')?.value==='c')s++;
let r=document.getElementById('result');r.style.display='block';r.innerHTML='ได้คะแนน '+s+' / 2 คะแนน<br><br>เมื่อพร้อมแล้ว ไปเรียนเนื้อหากันเลย! <br><a class="btn" href="lesson.html">ไปบทเรียน ➜</a>'}
</script></body></html>
